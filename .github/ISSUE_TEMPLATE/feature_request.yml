name: Feature request
description: Suggest a new wallet, component, option, or behavior.
labels: ["enhancement"]
body:
  - type: dropdown
    id: ecosystem
    attributes:
      label: Ecosystem
      options:
        - EVM
        - Solana
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you want. Include a code sample or mockup if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you tried.
