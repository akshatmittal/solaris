name: Feature request
description: Suggest a new wallet, component, option, or behavior for solariskit or polycons.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - EVM (solariskit)
        - Solana (solariskit/solana)
        - Both ecosystems
        - Polycons (@akshatmittal/polycons)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you want. Include a code sample or mockup if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you tried.
