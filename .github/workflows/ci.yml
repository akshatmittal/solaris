name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node, and Dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build Library
        run: pnpm build:lib

      - name: Typecheck
        run: pnpm typecheck
