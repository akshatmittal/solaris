name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node, and Dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build Workspace
        run: pnpm build

      - name: Changeset Release
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: Version Packages
          commit-message: Version Packages
