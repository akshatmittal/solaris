name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Workspace
        run: pnpm build

      - name: Changeset Release
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          pr-title: Version Packages
          commit-message: Version Packages
