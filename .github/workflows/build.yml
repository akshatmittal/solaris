name: Build

on:
  pull_request:

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node, and Dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Build Workspace
        run: pnpm build
