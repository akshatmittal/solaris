  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  autoprefixer: ^10.6.2
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  postcss: ^8.5.32
  postcss-prefix-selector: ^2.2.1
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: ^0.23.7
  typescript: ^6.0.3
  viem: ^2.57.18
  wagmi: ^3.7.11

overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  "@types/node": "catalog:"
  "react": "catalog:"
  "react-dom": "catalog:"
  "typescript": "catalog:"
  "abitype>zod": "-"
  "react-native": "-"
  "@solana/connector>@solana/connector-debugger": "-"
  "@solana/connector>@solana/keychain": "-"
  "@solana/connector>@solana/keychain-aws-kms": "-"
  "@solana/connector>@solana/keychain-fireblocks": "-"
  "@solana/connector>@solana/keychain-privy": "-"
  "@solana/connector>@solana/keychain-turnkey": "-"
  "@solana/connector>@solana/keychain-vault": "-"
  "@solana/connector>@solana/web3.js": "-"
  "@solana/connector>@walletconnect/universal-provider": "-"
  "@reown/appkit>@walletconnect/universal-provider": "2.26.0"

packageExtensions:
  "@solana/connector@*":
    peerDependenciesMeta:
      "@solana/connector-debugger":
        optional: true
      "@solana/keychain":
        optional: true
      "@solana/keychain-aws-kms":
        optional: true
      "@solana/keychain-fireblocks":
        optional: true
      "@solana/keychain-privy":
        optional: true
      "@solana/keychain-turnkey":
        optional: true
      "@solana/keychain-vault":
        optional: true
      "@solana/web3.js":
        optional: true
      "@walletconnect/universal-provider":
        optional: true

catalogMode: manual
strictDepBuilds: false

allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  esbuild: false
  protobufjs: false
  sharp: false
  utf-8-validate: false
