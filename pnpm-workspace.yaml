packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

catalog:
  "@tanstack/react-query": ^5.103.1
  "@types/node": ^26.6.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vanilla-extract/vite-plugin": ^5.2.6
  autoprefixer: ^10.6.1
  oxfmt: ^0.58.0
  oxlint: ^1.83.0
  postcss: ^8.5.28
  postcss-prefix-selector: ^2.2.1
  react: ^19.3.0
  react-dom: ^19.3.0
  tsdown: ^0.22.14
  typescript: ^6.0.3
  viem: ^2.56.8
  vite: ^8.3.0
  wagmi: ^3.7.7

overrides:
  "@types/react": "catalog:"
  "@types/react-dom": "catalog:"
  "@types/node": "catalog:"
  "react": "catalog:"
  "react-dom": "catalog:"
  "typescript": "catalog:"
  "abitype>zod": "-"
  "react-native": "-"
  "@solana/connector>@solana/connector-debugger": "-"
  "@solana/connector>@solana/keychain": "-"
  "@solana/connector>@solana/keychain-aws-kms": "-"
  "@solana/connector>@solana/keychain-fireblocks": "-"
  "@solana/connector>@solana/keychain-privy": "-"
  "@solana/connector>@solana/keychain-turnkey": "-"
  "@solana/connector>@solana/keychain-vault": "-"
  "@solana/connector>@walletconnect/universal-provider": "-"

packageExtensions:
  "@solana/connector@*":
    peerDependenciesMeta:
      "@solana/connector-debugger":
        optional: true
      "@solana/keychain":
        optional: true
      "@solana/keychain-aws-kms":
        optional: true
      "@solana/keychain-fireblocks":
        optional: true
      "@solana/keychain-privy":
        optional: true
      "@solana/keychain-turnkey":
        optional: true
      "@solana/keychain-vault":
        optional: true
      "@solana/web3.js":
        optional: true
      "@walletconnect/universal-provider":
        optional: true

catalogMode: manual
strictDepBuilds: false

allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  esbuild: false
  protobufjs: false
  sharp: false
  utf-8-validate: false
